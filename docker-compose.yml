services:

  backend:
    build:
      context: .
      dockerfile: deployment/Dockerfile

    container_name: credit-risk-backend

    ports:
      - "5000:5000"

  frontend:
    build:
      context: .
      dockerfile: frontend/Dockerfile

    container_name: credit-risk-frontend

    ports:
      - "8080:80"

    depends_on:
      - backend